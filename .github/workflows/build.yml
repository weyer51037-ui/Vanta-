
name: Build VibeEconomy

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name 'VibeEconomy-source*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: VibeEconomy source ZIP not found."
            find . -maxdepth 3 -type f
            exit 1
          fi
          mkdir extracted
          unzip -o "$ZIP" -d extracted
          echo "Files extracted:"
          find extracted -name pom.xml

      - name: Locate Maven project
        run: |
          POM=$(find extracted -name pom.xml | head -n 1)
          if [ -z "$POM" ]; then
            echo "ERROR: No pom.xml found inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build plugin
        run: mvn -B -f "$PROJECT_DIR/pom.xml" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VibeEconomy-jar
          path: extracted/**/target/*.jar
