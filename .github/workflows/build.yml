
name: Build VibeEconomy

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source code
        run: unzip -o VibeEconomy-source.zip

      - name: Build plugin
        working-directory: VibeEconomy
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: VibeEconomy-jar
          path: VibeEconomy/target/VibeEconomy-*.jar
